name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.1"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv venv .venv
      - run: uv pip install --python .venv -e ".[app,audio]" pytest ruff mypy
      - run: .venv/bin/python -m ruff check .
      - run: .venv/bin/python -m ruff format --check .
      - run: .venv/bin/python -m mypy
      - run: .venv/bin/python -m pytest
      # demo offline: sem chaves, sem rede
      - run: .venv/bin/python -m conversa_lens analisar samples/04_sarcasmo.txt --offline
