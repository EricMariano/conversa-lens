[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "conversa-lens"
version = "0.1.0"
description = "Análise de conversas de atendimento em PT-BR: decisões baratas por turno com Jev, LLM só nos momentos-chave."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Eric Mariano" }]
dependencies = [
    "python-dotenv>=1,<2",
    "langgraph>=1.2.12,<2",
    "langchain>=1.3.15,<2",
    "langchain-core>=1.6.2,<2",
    "langchain-typesafe>=0.0.1a3,<0.1",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
app = ["streamlit>=1.40,<2", "pandas>=2.2,<4", "python-dotenv>=1,<2"]
audio = ["faster-whisper>=1.1,<2", "librosa>=0.10,<2", "soundfile>=0.12,<1"]
# Áudio mono pela OpenAI (gpt-4o-transcribe-diarize); resumo com modelos da OpenAI.
openai = ["openai>=1.100,<3", "langchain-openai>=1,<2"]

[dependency-groups]
dev = ["mypy>=1.13,<3", "pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/conversa_lens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true

[[tool.mypy.overrides]]
module = ["faster_whisper", "faster_whisper.*", "librosa", "soundfile", "openai"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# O formatter cuida do comprimento; sobram só textos longos em PT-BR.
ignore = ["E501"]
